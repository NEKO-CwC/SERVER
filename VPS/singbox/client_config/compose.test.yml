name: singbox-client-config-test

services:
  subscription:
    image: python:3.12-alpine
    working_dir: /srv
    command: ["python", "/srv/subscription_server.py"]
    volumes:
      - ./test:/srv:ro
      - subscription-state:/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 2s
      timeout: 3s
      retries: 15

  client:
    build:
      context: .
      dockerfile: test/Dockerfile
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - .:/workspace:ro
      - subscription-state:/subscription-state:ro
    depends_on:
      subscription:
        condition: service_healthy
    stop_signal: SIGRTMIN+3

volumes:
  subscription-state:
