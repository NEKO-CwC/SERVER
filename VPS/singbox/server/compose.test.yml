name: singbox-server-test
services:
  subscription:
    image: python:3.12-alpine
    command: ["python", "-m", "http.server", "8080", "--directory", "/srv"]
    volumes:
      - ./test:/srv:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/fixture-config.json')"]
      interval: 2s
      timeout: 3s
      retries: 15
  server:
    build:
      context: ..
      dockerfile: client/test/Dockerfile
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ../../..:/repo:ro
    depends_on:
      subscription:
        condition: service_healthy
    stop_signal: SIGRTMIN+3
